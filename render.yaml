services:
  - type: web
    name: goodday
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm run build
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets: paste from render-env.txt (generate it with `npm run render-env`)
      - { key: JWT_SECRET, sync: false }
      - { key: PROJECT_ID, sync: false }
      - { key: PRIVATE_KEY_ID, sync: false }
      - { key: PRIVATE_KEY, sync: false }
      - { key: CLIENT_EMAIL, sync: false }
      - { key: CLIENT_ID, sync: false }
      - { key: CLIENT_X509_CERT_URL, sync: false }
